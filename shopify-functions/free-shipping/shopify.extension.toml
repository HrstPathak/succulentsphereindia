api_version = "2026-01"

[[extensions]]
name = "Free Shipping by Tag"
handle = "free-shipping-by-tag"
type = "function"
description = "Applies free shipping when any cart item has the free_shipping tag."

[[extensions.targeting]]
target = "cart.delivery-options.discounts.generate.run"
input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
export = "cart_delivery_options_discounts_generate_run"

[extensions.build]
command = "cargo build --target=wasm32-unknown-unknown --release"
path = "target/wasm32-unknown-unknown/release/free_shipping_discount.wasm"
watch = ["src/**/*.rs"]
