<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Succulents Just Arrived From Succulent Sphere — Here's What To Do Next</title>
<meta name="description" content="A real, no-fluff guide to succulent care after delivery in India — how to unbox, pot, water and acclimate bare-root succulents from Succulent Sphere, region by region.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#EAE0C4;
  --paper2:#DFCFA2;
  --card:#F6F0DE;
  --ink:#282316;
  --ink-soft:#5b543f;
  --terracotta:#AC4B2C;
  --terracotta-dark:#823823;
  --sage:#5C7245;
  --sage-dark:#3E5230;
  --tape:#CDA85F;
  --warn:#9C3B2C;
  --line: rgba(40,35,22,0.16);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 10% 0%, rgba(255,255,255,0.35), transparent 45%),
    var(--paper);
  color:var(--ink);
  font-family:'Inter', -apple-system, sans-serif;
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

/* kraft paper fiber texture */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:0.5;
  background-image:
    repeating-linear-gradient(115deg, rgba(40,35,22,0.025) 0px, rgba(40,35,22,0.025) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(25deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 4px);
  z-index:0;
}

.wrap{max-width:760px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}

a{color:var(--terracotta-dark);}

h1,h2,h3{
  font-family:'Fraunces', serif;
  font-weight:600;
  color:var(--ink);
  margin:0 0 0.4em;
  line-height:1.15;
}

/* ---------- top nav / label bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(234,224,196,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:760px; margin:0 auto; padding:12px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  font-family:'Space Grotesk', sans-serif;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-weight:700; letter-spacing:0.02em; font-size:15px; color:var(--terracotta-dark);
  white-space:nowrap;
}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--sage);display:inline-block;}
.toc-pills{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;}
.toc-pills::-webkit-scrollbar{display:none;}
.toc-pills a{
  font-size:12.5px; text-decoration:none; color:var(--ink-soft);
  padding:6px 11px; border:1px solid var(--line); border-radius:99px; white-space:nowrap;
  transition:all .15s ease;
}
.toc-pills a:hover{border-color:var(--terracotta); color:var(--terracotta-dark); background:var(--card);}
